<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Safwan, Zayan, Steve and Sahiem's Website</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
      color: #1f2937;
      background: #d8dde3;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 8%;
      background: white;
      border-bottom: 1px solid #e5e7eb;
    }

    nav {
      display: flex;
      gap: 1.25rem;
    }

    nav a {
      color: #374151;
      text-decoration: none;
      font-weight: 600;
    }

    nav a:hover {
      color: #2563eb;
    }

    main {
      display: grid;
      place-items: center;
      min-height: calc(100vh - 73px);
      padding: 2rem;
      text-align: center;
    }

    section {
      max-width: 650px;
    }

    h1 {
      margin: 0 0 1rem;
      font-size: clamp(2.5rem, 8vw, 4rem);
    }

    p {
      margin: 0 0 1.5rem;
      color: #4b5563;
      font-size: 1.125rem;
      line-height: 1.7;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 0.8rem 1.4rem;
      background: #2563eb;
      color: white;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <header>
    <strong>My Website</strong>
    <nav aria-label="Main navigation">
      <a href="#home">Home</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main id="home">
    <section>
      <h1>Welcome</h1>
      <p>This is a simple website built with HTML and CSS.</p>
      <button type="button" onclick="alert('Hello User!')">Get Started</button>
    </section>
  </main>
</body>
</html>
